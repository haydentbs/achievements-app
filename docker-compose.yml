version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: milestone-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-milestone_tracker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web Application (Deno Fresh)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milestone-tracker-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-milestone_tracker}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this-in-production}
      - PORT=${PORT:-8000}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
